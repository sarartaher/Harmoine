<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="illustration-title">
  <title id="illustration-title">A group of people collaborating around a laptop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="50%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="fuchsia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- soft decorative shapes -->
  <circle cx="120" cy="130" r="170" fill="#c4b5fd" opacity="0.30"/>
  <circle cx="1110" cy="110" r="140" fill="#a5b4fc" opacity="0.35"/>
  <circle cx="180" cy="840" r="170" fill="#ddd6fe" opacity="0.45"/>
  <circle cx="640" cy="80" r="6" fill="#818cf8" opacity="0.8"/>
  <circle cx="410" cy="120" r="8" fill="#a78bfa" opacity="0.8"/>
  <circle cx="880" cy="160" r="7" fill="#c084fc" opacity="0.8"/>
  <circle cx="250" cy="330" r="5" fill="#6366f1" opacity="0.7"/>
  <circle cx="960" cy="360" r="5" fill="#a78bfa" opacity="0.7"/>

  <!-- people, back row first -->
  <g>
    <circle cx="470" cy="450" r="44" fill="url(#sky)"/>
    <path d="M400 620c0-80 31-135 70-135s70 55 70 135z" fill="url(#sky)"/>
  </g>
  <g>
    <circle cx="730" cy="450" r="44" fill="url(#fuchsia)"/>
    <path d="M660 620c0-80 31-135 70-135s70 55 70 135z" fill="url(#fuchsia)"/>
  </g>
  <g>
    <circle cx="280" cy="470" r="44" fill="url(#violet)"/>
    <path d="M210 640c0-80 31-135 70-135s70 55 70 135z" fill="url(#violet)"/>
  </g>
  <g>
    <circle cx="920" cy="470" r="44" fill="url(#indigo)"/>
    <path d="M850 640c0-80 31-135 70-135s70 55 70 135z" fill="url(#indigo)"/>
  </g>

  <!-- laptop -->
  <rect x="545" y="495" width="110" height="115" rx="10" fill="#312e81"/>
  <rect x="555" y="505" width="90" height="95" rx="6" fill="#c7d2fe"/>
  <rect x="525" y="612" width="150" height="16" rx="8" fill="#4f46e5"/>

  <!-- table -->
  <rect x="140" y="610" width="920" height="100" rx="32" fill="url(#table)"/>

  <!-- plant -->
  <ellipse cx="1142" cy="700" rx="26" ry="52" fill="#34d399" transform="rotate(-18 1142 700)"/>
  <ellipse cx="1178" cy="712" rx="22" ry="44" fill="#10b981" transform="rotate(22 1178 712)"/>
  <rect x="1146" y="710" width="6" height="56" rx="3" fill="#059669"/>
  <path d="M1105 766h76l-10 88h-56z" fill="url(#violet)"/>
</svg>
